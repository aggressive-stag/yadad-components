# GitLab CI for yadad-components: publish only.
#
# GitHub (the source repo) runs the full gate on every push; GitLab is a push
# mirror that hosts the npm registry. This job publishes @yadad/components when
# its package.json version is not in the registry yet. It never versions or
# commits: bump the version locally, commit and push. See
# scripts/release/publish.sh.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

release:
  stage: deploy
  tags: [k8s]
  # Not -slim: the job clones the engine repo with git.
  image: docker.io/library/node:24.21.0-bookworm
  timeout: 20m
  variables:
    COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  script:
    - sh scripts/release/publish.sh
