# GitLab CI for yadad-components: the gate, then publish.
#
# This runner can reach the LAN registry that holds the engine's packages;
# GitHub's public runners cannot, so GitHub Actions is switched off and the
# gate runs here (2026-11-12, owner's decision). `test` runs on every branch
# push; `release` and `engine-range` run on the default branch only, and
# `release` waits for `test`, so a red gate never publishes. `release`
# publishes @yadad/components when its package.json version is not in the
# registry yet. It never versions or commits: bump the version locally,
# commit and push. See scripts/release/publish.sh.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH

stages: [test, deploy]

# The gate: what GitHub Actions used to run. The components link ../yadad
# (link: dependencies), so the engine is cloned and its theme built first.
test:
  stage: test
  tags: [k8s]
  # Not -slim: the job clones the engine repo with git.
  image: docker.io/library/node:24.21.0-bookworm
  timeout: 20m
  variables:
    COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  script:
    - git clone --depth 1 "${CI_SERVER_URL}/yadad/yadad.git" ../yadad
    - git config --global --add safe.directory "${CI_PROJECT_DIR}"
    - corepack enable
    - (cd ../yadad && pnpm install --frozen-lockfile && pnpm exec tsc -b packages/theme)
    - pnpm install --frozen-lockfile
    - pnpm typecheck
    - pnpm test
    - pnpm build:css && test -s dist/yadad-components.css

release:
  stage: deploy
  tags: [k8s]
  # Not -slim: the job clones the engine repo with git.
  image: docker.io/library/node:24.21.0-bookworm
  timeout: 20m
  needs: [test]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  script:
    - sh scripts/release/publish.sh

# Watchdog for the @yadad/core peer range, with a real verdict: this runner
# can reach the engine registry, which GitHub's public runners cannot (there
# the same check skips). Non-blocking and last: .post runs after deploy, so
# it can neither hold up nor reorder publishing, and allow_failure keeps the
# pipeline green when the range is stale (the job shows as a warning).
# Runs `check:engine --install`: the range check plus the full gate against
# the newest published engine.
engine-range:
  stage: .post
  tags: [k8s]
  image: docker.io/library/node:24.21.0-bookworm
  timeout: 20m
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      allow_failure: true
  variables:
    COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    npm_config_registry: "${CI_API_V4_URL}/packages/npm/"
  script:
    # Read access to the instance-level registry endpoint.
    - printf '%s\n' "${CI_API_V4_URL#https:}/packages/npm/:_authToken=${CI_JOB_TOKEN}" > "${HOME}/.npmrc"
    # Until contract-v0 is published the repo links ../yadad (as in release).
    - git clone --depth 1 "${CI_SERVER_URL}/yadad/yadad.git" ../yadad
    - git config --global --add safe.directory "${CI_PROJECT_DIR}"
    - corepack enable
    - (cd ../yadad && pnpm install --frozen-lockfile && pnpm exec tsc -b packages/theme)
    - pnpm install --frozen-lockfile
    - pnpm check:engine --install
