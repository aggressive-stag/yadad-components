# GitLab CI for yadad-components: publish only.
#
# GitHub (the source repo) runs the full gate on every push; GitLab is a push
# mirror that hosts the npm registry. This job publishes @yadad/components when
# its package.json version is not in the registry yet. It never versions or
# commits: bump the version locally, commit and push. See
# scripts/release/publish.sh.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

release:
  stage: deploy
  tags: [k8s]
  # Not -slim: the job clones the engine repo with git.
  image: docker.io/library/node:24.21.0-bookworm
  timeout: 20m
  variables:
    COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  script:
    - sh scripts/release/publish.sh

# Watchdog for the @yadad/core peer range, with a real verdict: this runner
# can reach the engine registry, which GitHub's public runners cannot (there
# the same check skips). Non-blocking and last: .post runs after deploy, so
# it can neither hold up nor reorder publishing, and allow_failure keeps the
# pipeline green when the range is stale (the job shows as a warning).
# Runs `check:engine --install`: the range check plus the full gate against
# the newest published engine.
engine-range:
  stage: .post
  tags: [k8s]
  image: docker.io/library/node:24.21.0-bookworm
  timeout: 20m
  allow_failure: true
  variables:
    COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    npm_config_registry: "${CI_API_V4_URL}/packages/npm/"
  script:
    # Read access to the instance-level registry endpoint.
    - printf '%s\n' "${CI_API_V4_URL#https:}/packages/npm/:_authToken=${CI_JOB_TOKEN}" > "${HOME}/.npmrc"
    # Until contract-v0 is published the repo links ../yadad (as in release).
    - git clone --depth 1 "${CI_SERVER_URL}/yadad/yadad.git" ../yadad
    - git config --global --add safe.directory "${CI_PROJECT_DIR}"
    - corepack enable
    - (cd ../yadad && pnpm install --frozen-lockfile)
    - pnpm install --frozen-lockfile
    - pnpm check:engine --install
