name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # re-run by hand after an engine change

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  components:
    runs-on: ubuntu-latest
    steps:
      # Until contract-v0 is published, @yadad/core and @yadad/testing are linked
      # from ../yadad, so check both repos out side by side.
      - uses: actions/checkout@v7
        with:
          path: yadad-components

      - uses: actions/checkout@v7
        with:
          repository: aggressive-stag/yadad
          path: yadad

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: yadad-components/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            yadad/pnpm-lock.yaml
            yadad-components/pnpm-lock.yaml

      - name: Install the engine (linked packages resolve their dependencies there)
        working-directory: yadad
        run: pnpm install --frozen-lockfile

      - name: Install
        working-directory: yadad-components
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: yadad-components
        run: pnpm typecheck

      - name: Contract kit, axe and stylesheet guardrails
        working-directory: yadad-components
        run: pnpm test

      - name: Build the stylesheet
        working-directory: yadad-components
        run: pnpm build:css && test -s dist/yadad-components.css

  # Watchdog for the @yadad/core peer range. The engine publishes often and a
  # new core minor (0.x -> 0.x+1) falls outside the declared range until
  # someone proves compatibility and widens it, so this job is what makes a
  # stale range visible. continue-on-error: it must flag, not block — a new
  # engine minor lands *before* components can prove themselves against it,
  # and failing the main job on every unrelated push would hide the signal.
  #
  # Network caveat: the engine registry (gitlab.base-camp.dev) is LAN-only
  # and unresolvable from GitHub's public runners. The script treats an
  # unreachable registry as a loud SKIP (exit 0, "no verdict produced"), so
  # on public runners this job is a documented no-op until a self-hosted
  # runner with registry access exists. Where the registry IS reachable,
  # a reachable-but-stale range fails the job (surfaced, non-blocking).
  engine-range:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      # Same checkout/install shape as the main job: the check runs in the
      # installed workspace (needs node_modules to resolve semver) and
      # queries the registry for published @yadad/* versions.
      - uses: actions/checkout@v7
        with:
          path: yadad-components

      - uses: actions/checkout@v7
        with:
          repository: aggressive-stag/yadad
          path: yadad

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: yadad-components/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            yadad/pnpm-lock.yaml
            yadad-components/pnpm-lock.yaml

      - name: Install the engine
        working-directory: yadad
        run: pnpm install --frozen-lockfile

      - name: Install
        working-directory: yadad-components
        run: pnpm install --frozen-lockfile

      - name: Peer range covers the newest published @yadad/core
        working-directory: yadad-components
        run: pnpm check:engine
